server {
  listen 80;
  server_name _;

  proxy_set_header Host $host;
  proxy_set_header X-Real-IP $remote_addr;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto $scheme;

  location = / {
    return 302 $scheme://$http_host/index.html;
  }

  location = /index.html {
    default_type text/html;
    alias /usr/share/nginx/html/index.html;
  }

  location = /health {
    return 200 "ok\n";
  }

  location = /c/01 { return 302 /c/01/; }
  location = /c/02 { return 302 /c/02/; }
  location = /c/03 { return 302 /c/03/; }
  location = /c/04 { return 302 /c/04/; }
  location = /c/05 { return 302 /c/05/; }
  location = /c/06 { return 302 /c/06/; }
  location = /c/07 { return 302 /c/07/; }
  location = /c/08 { return 302 /c/08/; }
  location = /c/09 { return 302 /c/09/; }
  location = /c/10 { return 302 /c/10/; }

  location /c/01/ { proxy_pass http://challenge01:8101/; }
  location /c/02/ { proxy_pass http://challenge02:8102/; }
  location /c/03/ { proxy_pass http://challenge03:8103/; }
  location /c/04/ { proxy_pass http://challenge04:8104/; }
  location /c/05/ { proxy_pass http://challenge05:8105/; }
  location /c/06/ { proxy_pass http://challenge06:8106/; }
  location /c/07/ { proxy_pass http://challenge07:8107/; }
  location /c/08/ { proxy_pass http://challenge08:8108/; }
  location /c/09/ { proxy_pass http://challenge09:8109/; }
  location /c/10/ { proxy_pass http://challenge10:8110/; }
}
