services:
  reverse-proxy:
    image: nginx:1.27-alpine
    depends_on:
      challenge01:
        condition: service_healthy
      challenge02:
        condition: service_healthy
      challenge03:
        condition: service_healthy
      challenge04:
        condition: service_healthy
      challenge05:
        condition: service_healthy
      challenge06:
        condition: service_healthy
      challenge07:
        condition: service_healthy
      challenge08:
        condition: service_healthy
      challenge09:
        condition: service_healthy
      challenge10:
        condition: service_healthy
    ports:
      - "${REVERSE_PROXY_PORT:-8180}:80"
    volumes:
      - ./reverse-proxy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./reverse-proxy/index.html:/usr/share/nginx/html/index.html:ro
    restart: unless-stopped

  challenge01:
    build:
      context: .
      dockerfile: challenges/01-travel-desk/Dockerfile
    env_file: .env
    environment:
      PORT: "8101"
      DATA_DIR: /tmp/data
      LLM_PROVIDER: ${LLM_PROVIDER:-deepseek}
      CHALLENGE_FLAG: MSP{prompt_policies_are_not_entitlement_checks}
      ADMIN_TOKEN: ${ADMIN_TOKEN:-local-admin}
      RATE_LIMIT_PER_MINUTE: ${RATE_LIMIT_PER_MINUTE:-15}
      RELOAD: ${RELOAD:-true}
      PYTHONPATH: /app/challenge:/app
    ports: ["8101:8101"]
    volumes:
      - ./shared:/app/shared
      - ./challenges/01-travel-desk:/app/challenge
    tmpfs: ["/tmp"]
    read_only: true
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8101/health').read()"]
      interval: 20s
      timeout: 5s
      retries: 3

