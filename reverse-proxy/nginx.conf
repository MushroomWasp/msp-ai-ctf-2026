server {
  listen 80;
  server_name _;
  resolver 127.0.0.11 valid=10s ipv6=off;
  resolver_timeout 5s;

  proxy_set_header Host $host;
  proxy_set_header X-Real-IP $remote_addr;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto $scheme;

  location = / {
    return 302 $scheme://$http_host/index.html;
  }

  location = /index.html {
    default_type text/html;
    alias /usr/share/nginx/html/index.html;
  }

  location = /AI-HACKING-1.png {
    alias /usr/share/nginx/html/AI-HACKING-1.png;
  }

  location = /health {
    return 200 "ok\n";
  }

  location = /c/01 { return 302 /c/01/; }
  location = /c/02 { return 302 /c/02/; }
  location = /c/03 { return 302 /c/03/; }
  location = /c/04 { return 302 /c/04/; }
  location = /c/05 { return 302 /c/05/; }
  location = /c/06 { return 302 /c/06/; }
  location = /c/07 { return 302 /c/07/; }
  location = /c/08 { return 302 /c/08/; }
  location = /c/09 { return 302 /c/09/; }
  location = /c/10 { return 302 /c/10/; }

  location /c/01/ {
    set $challenge_upstream challenge01:8101;
    rewrite ^/c/01/(.*)$ /$1 break;
    proxy_pass http://$challenge_upstream;
  }

  location /c/02/ {
    set $challenge_upstream challenge02:8102;
    rewrite ^/c/02/(.*)$ /$1 break;
    proxy_pass http://$challenge_upstream;
  }

  location /c/03/ {
    set $challenge_upstream challenge03:8103;
    rewrite ^/c/03/(.*)$ /$1 break;
    proxy_pass http://$challenge_upstream;
  }

  location /c/04/ {
    set $challenge_upstream challenge04:8104;
    rewrite ^/c/04/(.*)$ /$1 break;
    proxy_pass http://$challenge_upstream;
  }

  location /c/05/ {
    set $challenge_upstream challenge05:8105;
    rewrite ^/c/05/(.*)$ /$1 break;
    proxy_pass http://$challenge_upstream;
  }

  location /c/06/ {
    set $challenge_upstream challenge06:8106;
    rewrite ^/c/06/(.*)$ /$1 break;
    proxy_pass http://$challenge_upstream;
  }

  location /c/07/ {
    set $challenge_upstream challenge07:8107;
    rewrite ^/c/07/(.*)$ /$1 break;
    proxy_pass http://$challenge_upstream;
  }

  location /c/08/ {
    set $challenge_upstream challenge08:8108;
    rewrite ^/c/08/(.*)$ /$1 break;
    proxy_pass http://$challenge_upstream;
  }

  location /c/09/ {
    set $challenge_upstream challenge09:8109;
    rewrite ^/c/09/(.*)$ /$1 break;
    proxy_pass http://$challenge_upstream;
  }

  location /c/10/ {
    set $challenge_upstream challenge10:8110;
    rewrite ^/c/10/(.*)$ /$1 break;
    proxy_pass http://$challenge_upstream;
  }
    location /c/11/ {
    set $challenge_upstream challenge10:8111;
    rewrite ^/c/11/(.*)$ /$1 break;
    proxy_pass http://$challenge_upstream;
  }
}
