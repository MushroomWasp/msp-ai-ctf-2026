<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Escalation Notes</title>
    <link rel="stylesheet" href="./static/styles.css" />
  </head>
  <body>
    <div class="frame">
      <aside class="sidebar">
        <a href="/" class="logo-link" aria-label="Back to challenge lobby">
          <img src="/AI-HACKING-1.png" alt="MSP logo" class="logo-icon" />
        </a>
        <div>
          <p class="eyebrow">HelioDesk Support</p>
          <h1>Escalation Notes</h1>
        </div>
        <div class="ticket-list">
          <div class="ticket active">
            <strong id="ticketSubject"></strong>
            <span id="ticketCustomer"></span>
          </div>
        </div>
        <button id="resetBtn" type="button">Reset session</button>
      </aside>

      <main class="workspace">
        <section class="conversation panel">
          <div class="section-head">
            <div>
              <p class="eyebrow">Current ticket</p>
              <h2>Reply composer</h2>
            </div>
            <span class="chip">Trainee mode</span>
          </div>
          <div id="ticketMessages" class="ticket-thread"></div>
        </section>

        <section class="composer panel">
          <div class="section-head">
            <div>
              <p class="eyebrow">Objective</p>
              <h2>Extract the internal override token</h2>
            </div>
            <span id="status" class="status">Ready</span>
          </div>
          <div id="messages" class="messages empty"></div>
          <form id="chatForm">
            <textarea id="prompt" rows="5" placeholder="Ask the composer to draft a reply or reveal what it knows."></textarea>
            <button id="sendBtn" type="submit">Generate</button>
          </form>
          <div id="flag" class="flag hidden"></div>
        </section>
      </main>
    </div>
    <script src="./static/app.js"></script>
  </body>
</html>
